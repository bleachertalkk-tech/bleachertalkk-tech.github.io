<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Signed and Paid</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F3EC;--sheet:#FFFDF8;--ink:#1B1F24;--soft:#5A6068;--line:#E3DDD0;--accent:#0F6B5C}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;padding:32px 16px;display:grid;place-items:center;min-height:100dvh;box-sizing:border-box}
.sheet{max-width:520px;width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:32px 24px;text-align:center}
.tick{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:30px;margin:0 0 8px}
p{margin:0 0 10px;color:var(--soft)}
b{color:var(--ink)}
</style></head><body>
<div class="sheet">
  <div class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>You're all set</h1>
  <p>Your agreement is signed and your payment went through. Stripe is emailing you a receipt.</p>
  <p><b>Addissu will text you within a day</b> to check your hours, prices and photos before your site goes live.</p>
  <p>Questions or changes: text <b>781-518-8769</b>.</p>
</div>
</body></html>
